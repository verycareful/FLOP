# Two gates, both hard: the tree is written under both, so there is no
# backlog and nothing to triage.
#
#   format   clang-format --dry-run --Werror against the tracked .clang-format
#   tidy     clang-tidy over every translation unit, with WarningsAsErrors
#            set in .clang-tidy, on the compile database CMake generates
#
# Both run clang 22, the version the tree is formatted and tidied with on
# the maintainer's host, so a verdict here is the verdict the same command
# gives there. The ubuntu-26.04 image ships it, so nothing is installed.

name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Check
        run: |
          find include src tests benchmarks \( -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format-22 --dry-run --Werror

  tidy:
    name: clang-tidy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      # Configure only: clang-tidy needs the compile database for each file's
      # flags and include paths, and generating it compiles nothing. The
      # fetched test and benchmark dependencies have to be present for their
      # headers to resolve.
      - name: Generate the compile database
        env:
          CC: clang-22
          CXX: clang++-22
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DFLOP_BUILD_TESTS=ON
          -DFLOP_BUILD_BENCHMARKS=ON
      - name: Run
        run: >
          run-clang-tidy-22 -p build -quiet
          -clang-tidy-binary clang-tidy-22
          'FLOP/(src|tests|benchmarks)/'
