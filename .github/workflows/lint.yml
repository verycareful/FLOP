# Two gates, both hard from the first commit: the tree was written under
# both, so there is no backlog and nothing to triage.
#
#   format   clang-format --dry-run --Werror against the tracked .clang-format
#   tidy     clang-tidy over every translation unit, with WarningsAsErrors
#            set in .clang-tidy, on the compile database CMake generates

name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check
        run: |
          find include src tests benchmarks \( -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

  tidy:
    name: clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: sudo apt-get update && sudo apt-get install -y clang clang-tidy clang-tools ninja-build
      # Configure only: clang-tidy needs the compile database for each file's
      # flags and include paths, and generating it compiles nothing. The
      # fetched test and benchmark dependencies have to be present for their
      # headers to resolve.
      - name: Generate the compile database
        env:
          CC: clang
          CXX: clang++
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DFLOP_BUILD_TESTS=ON
          -DFLOP_BUILD_BENCHMARKS=ON
      - name: Run
        run: |
          TIDY=$(command -v run-clang-tidy || echo /usr/share/clang/run-clang-tidy.py)
          "$TIDY" -p build -quiet 'FLOP/(src|tests|benchmarks)/'
