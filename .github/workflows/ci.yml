# One leg per tree the maintainer builds on the host, so a local sweep and
# CI verify the same thing. The leg names are the local capture slots:
#
#   gcc          the image's default gcc, strict library (the documented build)
#   gcc14        g++-14, strict library
#   clang        the image's default clang, strict library
#   gcc-fastlib  the default gcc with the library itself under -ffast-math,
#                which exercises the facade's fast-math build
#
# Every leg builds both test binaries, flop_tests_strict and flop_tests_fast,
# and runs both. The ubuntu-26.04 image ships every compiler named here, so
# nothing is installed.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            cc: gcc
            cxx: g++
            fast_math: OFF
          - name: gcc14
            cc: gcc-14
            cxx: g++-14
            fast_math: OFF
          - name: clang
            cc: clang
            cxx: clang++
            fast_math: OFF
          - name: gcc-fastlib
            cc: gcc
            cxx: g++
            fast_math: ON
    steps:
      - uses: actions/checkout@v5

      - name: Compiler version
        run: ${{ matrix.cxx }} --version

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFLOP_BUILD_TESTS=ON
          -DFLOP_FAST_MATH=${{ matrix.fast_math }}

      - name: Build
        run: cmake --build build

      - name: Test (strict variant)
        run: ./build/tests/flop_tests_strict

      - name: Test (fast-math variant)
        run: ./build/tests/flop_tests_fast

  benchmarks-build:
    name: benchmarks build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DFLOP_BUILD_TESTS=OFF
          -DFLOP_BUILD_BENCHMARKS=ON
      - name: Build
        run: cmake --build build
      - name: Smoke run
        run: ./build/benchmarks/bench_cobyla --benchmark_filter=Unbounded/16 --benchmark_min_time=0.05s
